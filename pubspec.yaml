name: zenjigodriver
description: "RIDE EASE frontend application."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.3
  http: ^1.2.2
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
